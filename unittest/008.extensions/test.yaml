description: Build and test every supported source extension.

steps:
  - build:
      sources:
        - .

  - run:
      binary: c_application
      exit_code: 0
      stdout: |
        source .c

  - run:
      binary: cc_application
      exit_code: 0
      stdout: |
        source .cc

  - run:
      binary: cpp_application
      exit_code: 0
      stdout: |
        source .cpp

  - run:
      binary: plus_application
      exit_code: 0
      stdout: |
        source .c++

  - test:
      sources:
        - .
      binaries:
        c.test:
          passed: 1
        cc.test:
          passed: 1
        cpp.test:
          passed: 1
        plus.test:
          passed: 1
