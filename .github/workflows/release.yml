name: Publish host release

on:
  push:
    tags:
      - "v*.*"

permissions:
  contents: write

env:
  GO_VERSION: 1.23.12
  GO_SHA256: d3847fef834e9db11bf64e3fb34db9c04db14e068eeb064f49af747010454f90
  HOST_BUILD_IMAGE: ubuntu:18.04@sha256:152dc042452c496007f07ca9127571cb9c29697f42acbfad72324b2bb2e43c98
  LLVM_VERSION: 18.1.8
  LLVM_SHA256: 54ec30358afcc9fb8aa74307db3046f5187f9fb89fb37064cdde906e062ebf36
  ARCHIVE_NAME: hard-${{ github.ref_name }}.tar.gz
  CHECKSUM_NAME: hard-${{ github.ref_name }}.tar.gz.sha256

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Download LLVM 18
        run: |
          llvm_archive="$RUNNER_TEMP/llvm.tar.xz"
          curl --fail --location --output "$llvm_archive" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/clang%2Bllvm-${LLVM_VERSION}-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
          echo "$LLVM_SHA256  $llvm_archive" | sha256sum --check -

      - name: Build portable archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_directory="$RUNNER_TEMP/release"
          mkdir -p "$release_directory"
          source_date_epoch=$(git show -s --format=%ct HEAD)

          docker run --rm --platform linux/amd64 \
            --env ARCHIVE_NAME \
            --env CHECKSUM_NAME \
            --env GO_SHA256 \
            --env GO_VERSION \
            --env LLVM_VERSION \
            --env RELEASE_TAG \
            --env SOURCE_DATE_EPOCH="$source_date_epoch" \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$RUNNER_TEMP/llvm.tar.xz:/tmp/llvm.tar.xz:ro" \
            --volume "$release_directory:/out" \
            "$HOST_BUILD_IMAGE" \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                binutils \
                ca-certificates \
                curl \
                libstdc++-7-dev \
                libtinfo5 \
                patchelf \
                xz-utils

              tar -xJf /tmp/llvm.tar.xz -C /opt
              llvm_root="/opt/clang+llvm-${LLVM_VERSION}-x86_64-linux-gnu-ubuntu-18.04"
              ln -s "$llvm_root" /usr/lib/llvm-18
              ln -s libclang.so "$llvm_root/lib/libclang-18.so"

              curl --fail --silent --show-error --location \
                --output /tmp/go.tar.gz \
                "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
              echo "$GO_SHA256  /tmp/go.tar.gz" | sha256sum --check -
              tar -C /usr/local -xzf /tmp/go.tar.gz

              cd /src/hard
              CC="$llvm_root/bin/clang" \
              CXX="$llvm_root/bin/clang++" \
              CGO_ENABLED=1 \
              CGO_LDFLAGS="-L$llvm_root/lib" \
              GOARCH=amd64 \
              GOOS=linux \
                /usr/local/go/bin/go build \
                  -trimpath \
                  -ldflags="-s -w" \
                  -o /tmp/hard .

              archive_root=/tmp/hard-linux-amd64
              runtime_root="$archive_root/libexec/hard"
              install -d \
                "$archive_root/bin" \
                "$runtime_root/bin" \
                "$runtime_root/format" \
                "$runtime_root/lib" \
                "$runtime_root/licenses" \
                "$archive_root/share/bash-completion/completions" \
                "$archive_root/share/zsh/site-functions" \
                "$archive_root/share/fish/vendor_completions.d"
              install -m 0755 /src/hard.sh "$archive_root/bin/hard"
              install -m 0755 /tmp/hard "$runtime_root/hard"
              install -m 0755 "$llvm_root/bin/clang-format" "$runtime_root/bin/clang-format"
              install -m 0644 /src/hard.h "$runtime_root/hard.h"
              install -m 0644 /src/format/format.v1 "$runtime_root/format/format.v1"
              install -m 0644 /src/LICENSE "$runtime_root/licenses/hard-LICENSE"
              install -m 0644 \
                "$llvm_root/include/llvm/Support/LICENSE.TXT" \
                "$runtime_root/licenses/LLVM-LICENSE"
              install -m 0644 \
                /usr/share/doc/libtinfo5/copyright \
                "$runtime_root/licenses/libtinfo5-copyright"
              install -m 0644 \
                "$llvm_root/lib/libclang.so.18.1.8" \
                "$runtime_root/lib/libclang.so.18.1.8"
              ln -s libclang.so.18.1.8 "$runtime_root/lib/libclang.so.18.1"
              ln -s libclang.so.18.1 "$runtime_root/lib/libclang.so"
              install -m 0644 \
                /lib/x86_64-linux-gnu/libtinfo.so.5.9 \
                "$runtime_root/lib/libtinfo.so.5.9"
              ln -s libtinfo.so.5.9 "$runtime_root/lib/libtinfo.so.5"
              cp -a "$llvm_root/lib/clang" "$runtime_root/lib/clang"
              printf "%s\n" "$RELEASE_TAG" > "$runtime_root/VERSION"

              patchelf --set-rpath "\$ORIGIN/lib" "$runtime_root/hard"

              "$runtime_root/hard" completion bash \
                > "$archive_root/share/bash-completion/completions/hard"
              "$runtime_root/hard" completion zsh \
                > "$archive_root/share/zsh/site-functions/_hard"
              "$runtime_root/hard" completion fish \
                > "$archive_root/share/fish/vendor_completions.d/hard.fish"
              chmod 0644 \
                "$archive_root/share/bash-completion/completions/hard" \
                "$archive_root/share/zsh/site-functions/_hard" \
                "$archive_root/share/fish/vendor_completions.d/hard.fish"
              bash -n "$archive_root/share/bash-completion/completions/hard"

              LD_LIBRARY_PATH="$runtime_root/lib" ldd "$runtime_root/hard" | tee /tmp/hard.ldd
              LD_LIBRARY_PATH="$runtime_root/lib" ldd "$runtime_root/bin/clang-format" | tee /tmp/clang-format.ldd
              if grep -q "not found" /tmp/hard.ldd /tmp/clang-format.ldd; then
                exit 1
              fi

              max_glibc=$(
                readelf --version-info \
                  "$runtime_root/hard" \
                  "$runtime_root/bin/clang-format" \
                  "$runtime_root/lib/libclang.so.18.1.8" \
                  "$runtime_root/lib/libtinfo.so.5.9" \
                  | grep -o "GLIBC_[0-9.]*" \
                  | sort -Vu \
                  | tail -1
              )
              if [ "$(printf "%s\n%s\n" "$max_glibc" GLIBC_2.27 | sort -V | tail -1)" != GLIBC_2.27 ]; then
                echo "host release requires $max_glibc, expected at most GLIBC_2.27" >&2
                exit 1
              fi

              "$runtime_root/hard" --help >/dev/null
              "$runtime_root/bin/clang-format" --version

              tar \
                --create \
                --directory /tmp \
                --file - \
                --group=0 \
                --mtime="@$SOURCE_DATE_EPOCH" \
                --numeric-owner \
                --owner=0 \
                --sort=name \
                hard-linux-amd64 \
                | gzip -n > "/out/$ARCHIVE_NAME"
              cd /out
              sha256sum "$ARCHIVE_NAME" > "$CHECKSUM_NAME"
            '

      - name: Smoke-test supported glibc baselines
        run: |
          set -euo pipefail
          for image in ubuntu:18.04 ubuntu:22.04 ubuntu:24.04; do
            docker run --rm --platform linux/amd64 \
              --volume "$RUNNER_TEMP/release/$ARCHIVE_NAME:/tmp/hard.tar.gz:ro" \
              "$image" \
              sh -euxc '
                mkdir -p /tmp/home /tmp/project /tmp/release
                tar -xzf /tmp/hard.tar.gz --directory /tmp/release
                hard=/tmp/release/hard-linux-amd64/bin/hard
                printf "int answer=42;\n" > /tmp/project/example.cpp
                HOME=/tmp/home "$hard" --target=host --help >/dev/null
                HOME=/tmp/home "$hard" --target=host format /tmp/project/example.cpp
                grep -q "int answer = 42;" /tmp/project/example.cpp
                test -s /tmp/release/hard-linux-amd64/share/bash-completion/completions/hard
                test -s /tmp/release/hard-linux-amd64/share/zsh/site-functions/_hard
                test -s /tmp/release/hard-linux-amd64/share/fish/vendor_completions.d/hard.fish
                bash -n /tmp/release/hard-linux-amd64/share/bash-completion/completions/hard
                HOME=/tmp/home "$hard" __complete --target= > /tmp/targets
                grep -qx host /tmp/targets
                grep -qx linux64 /tmp/targets
                grep -qx 'linux64:v2.0-ubuntu.22.04' /tmp/targets
                ! grep -qx linux.v1 /tmp/targets
                HOME=/tmp/home bash --noprofile --norc -c \
                  '. "$1"; complete -p hard' \
                  _ /tmp/release/hard-linux-amd64/share/bash-completion/completions/hard
              '
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hard-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/release/${{ env.ARCHIVE_NAME }}
            ${{ runner.temp }}/release/${{ env.CHECKSUM_NAME }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber \
              "$RUNNER_TEMP/release/$ARCHIVE_NAME" \
              "$RUNNER_TEMP/release/$CHECKSUM_NAME"
          else
            gh release create "$RELEASE_TAG" \
              --generate-notes \
              --title "$RELEASE_TAG" \
              "$RUNNER_TEMP/release/$ARCHIVE_NAME" \
              "$RUNNER_TEMP/release/$CHECKSUM_NAME"
          fi
