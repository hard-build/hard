name: Publish container image

on:
  push:
    branches:
      - main
    paths:
      - "target/*/*.Dockerfile"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find new targets
        id: targets
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "cannot verify newly added targets: missing commit $BEFORE_SHA" >&2
            exit 1
          fi

          mapfile -t dockerfiles < <(
            git diff --no-renames --diff-filter=A --name-only \
              "$BEFORE_SHA" "$CURRENT_SHA" -- "target/*/*.Dockerfile"
          )

          targets=()
          for dockerfile in "${dockerfiles[@]}"; do
            relative=${dockerfile#target/}
            image=${relative%%/*}
            filename=${relative#*/}
            version=${filename%.Dockerfile}
            if [[ "$dockerfile" != "target/$image/$version.Dockerfile" ]] || \
               [[ ! "$image" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
              echo "invalid target Dockerfile name: $dockerfile" >&2
              exit 1
            fi
            if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+-ubuntu\.[0-9]+\.[0-9]+$ ]] && \
               [[ ! "$version" =~ ^v[0-9]+\.[0-9]+-alpine\.[0-9]+\.[0-9]+-static$ ]] && \
               [[ ! "$version" =~ ^v[0-9]+\.[0-9]+-glibc\.[0-9]+\.[0-9]+$ ]] && \
               [[ ! "$version" =~ ^v[0-9]+\.[0-9]+-musl\.[0-9]+\.[0-9]+\.[0-9]+-static$ ]] && \
               [[ ! "$version" =~ ^v[0-9]+\.[0-9]+-llvm-mingw\.[0-9]{8}-ucrt$ ]]; then
              echo "invalid target Dockerfile name: $dockerfile" >&2
              exit 1
            fi

            if [[ -n "$(git log -1 --format=%H "$BEFORE_SHA" -- "$dockerfile")" ]]; then
              echo "Skipping previously known image $image:$version"
              continue
            fi

            hard_version=${version%%-*}
            if ! git show-ref --verify --quiet "refs/tags/$hard_version"; then
              echo "hard release tag does not exist: $hard_version" >&2
              exit 1
            fi
            hard_revision=$(git rev-parse "$hard_version^{commit}")

            publish_latest=false
            if [[ "$version" =~ -(ubuntu|glibc)\. ]]; then
              latest_dockerfile=$(
                find "target/$image" -maxdepth 1 -type f \
                  \( -name 'v*-ubuntu.*.Dockerfile' -o -name 'v*-glibc.*.Dockerfile' \) \
                  -print \
                  | sort -V \
                  | tail -1
              )
              if [[ "$dockerfile" == "$latest_dockerfile" ]]; then
                publish_latest=true
              fi
            elif [[ "$version" =~ -llvm-mingw\. ]]; then
              latest_dockerfile=$(
                find "target/$image" -maxdepth 1 -type f \
                  -name 'v*-llvm-mingw.*-ucrt.Dockerfile' -print \
                  | sort -V \
                  | tail -1
              )
              if [[ "$dockerfile" == "$latest_dockerfile" ]]; then
                publish_latest=true
              fi
            fi

            targets+=("$(
              jq -cn \
                --arg dockerfile "$dockerfile" \
                --arg hard_revision "$hard_revision" \
                --arg hard_version "$hard_version" \
                --arg image "$image" \
                --argjson publish_latest "$publish_latest" \
                --arg version "$version" \
                '{dockerfile: $dockerfile, hard_revision: $hard_revision, hard_version: $hard_version, image: $image, publish_latest: $publish_latest, version: $version}'
            )")
          done

          targets_json=$(printf '%s\n' "${targets[@]}" | jq -cs .)
          echo "targets=$targets_json" >> "$GITHUB_OUTPUT"

  publish:
    needs: discover
    if: needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=latest,enable=${{ matrix.publish_latest }}

      - name: Build ${{ matrix.image }}:${{ matrix.version }}
        uses: docker/build-push-action@v7
        with:
          build-args: |
            HARD_REVISION=${{ matrix.hard_revision }}
            HARD_VERSION=${{ matrix.hard_version }}
          context: .
          file: ${{ matrix.dockerfile }}
          labels: |
            org.opencontainers.image.revision=${{ matrix.hard_revision }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.version }}
          load: true
          platforms: linux/amd64
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test ${{ matrix.image }}:${{ matrix.version }}
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ matrix.version }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          project=$(mktemp -d)
          hard_root=$(mktemp -d)
          trap 'rm -rf "$project" "$hard_root"' EXIT
          cat > "$project/main.cpp" <<'EOF'
          #include <cstddef>
          #include <iostream>

          int main()
          {
              std::cout << (sizeof(std::max_align_t) > 0 ? "ok" : "invalid");
          }
          EOF

          docker run --rm \
            --mount "type=bind,source=$project,target=/project" \
            --user "$(id -u):$(id -g)" \
            "$IMAGE" \
            build -s main.cpp

          if [[ "$IMAGE_NAME" == windows64 ]]; then
            test -f "$project/main.exe"
            pe=$(docker run --rm \
              --entrypoint /opt/llvm-mingw/bin/llvm-readobj \
              --mount "type=bind,source=$project,target=/project,readonly" \
              --user "$(id -u):$(id -g)" \
              "$IMAGE" \
              --file-headers --coff-imports /project/main.exe)
            grep -F 'IMAGE_FILE_MACHINE_AMD64' <<< "$pe"
            grep -Fi 'api-ms-win-crt-' <<< "$pe"

            output=$(docker run --rm \
              --mount "type=bind,source=$project,target=/project" \
              --mount "type=bind,source=$hard_root,target=/hard" \
              --user "$(id -u):$(id -g)" \
              "$IMAGE" \
              run -s main.cpp)
            test "$output" = ok

            docker run --rm \
              --entrypoint python3 \
              --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
              --mount "type=bind,source=$hard_root,target=/hard" \
              --user "$(id -u):$(id -g)" \
              --workdir /workspace \
              "$IMAGE" \
              unittest/run.py \
              --hard=/usr/local/libexec/hard/hard \
              --executable-suffix=.exe \
              --executable-runner=wine
          else
            output=$(docker run --rm \
              --entrypoint /project/main \
              --mount "type=bind,source=$project,target=/project" \
              --user "$(id -u):$(id -g)" \
              "$IMAGE")
            test "$output" = ok
          fi

          if [[ "$IMAGE_VERSION" == *-static ]]; then
            docker run --rm \
              --entrypoint sh \
              --mount "type=bind,source=$project,target=/project" \
              --user "$(id -u):$(id -g)" \
              "$IMAGE" \
              -euc '! readelf --program-headers /project/main | grep -q INTERP; ! readelf --dynamic /project/main 2>/dev/null | grep -q NEEDED'
          fi

          if [[ "$IMAGE_VERSION" == *-glibc.* ]]; then
            expected=${IMAGE_VERSION##*-glibc.}
            actual=$(docker run --rm \
              --entrypoint getconf \
              "$IMAGE" \
              GNU_LIBC_VERSION)
            test "$actual" = "glibc $expected"
          elif [[ "$IMAGE_VERSION" == *-musl.*-static ]]; then
            expected=${IMAGE_VERSION##*-musl.}
            expected=${expected%-static}
            actual=$(docker run --rm \
              --entrypoint sh \
              "$IMAGE" \
              -c 'ldd --version 2>&1')
            grep -Fqx "Version $expected" <<< "$actual"
          fi

      - name: Publish ${{ matrix.image }}:${{ matrix.version }}
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"
