name: Publish container image

on:
  push:
    branches:
      - main
    paths:
      - "target/*/*.Dockerfile"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find new targets
        id: targets
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "cannot verify newly added targets: missing commit $BEFORE_SHA" >&2
            exit 1
          fi

          mapfile -t dockerfiles < <(
            git diff --no-renames --diff-filter=A --name-only \
              "$BEFORE_SHA" "$CURRENT_SHA" -- "target/*/*.Dockerfile"
          )

          targets=()
          for dockerfile in "${dockerfiles[@]}"; do
            relative=${dockerfile#target/}
            image=${relative%%/*}
            filename=${relative#*/}
            version=${filename%.Dockerfile}
            if [[ "$dockerfile" != "target/$image/$version.Dockerfile" ]] || \
               [[ ! "$image" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || \
               [[ ! "$version" =~ ^v[0-9]+\.[0-9]+-ubuntu\.[0-9]+\.[0-9]+$ ]]; then
              echo "invalid target Dockerfile name: $dockerfile" >&2
              exit 1
            fi

            if [[ -n "$(git log -1 --format=%H "$BEFORE_SHA" -- "$dockerfile")" ]]; then
              echo "Skipping previously known image $image:$version"
              continue
            fi

            hard_version=${version%%-ubuntu.*}
            if ! git show-ref --verify --quiet "refs/tags/$hard_version"; then
              echo "hard release tag does not exist: $hard_version" >&2
              exit 1
            fi
            hard_revision=$(git rev-parse "$hard_version^{commit}")

            latest_dockerfile=$(
              find "target/$image" -maxdepth 1 -type f \
                -name 'v*-ubuntu.*.Dockerfile' -print \
                | sort -V \
                | tail -1
            )
            publish_latest=false
            if [[ "$dockerfile" == "$latest_dockerfile" ]]; then
              publish_latest=true
            fi

            targets+=("$(
              jq -cn \
                --arg dockerfile "$dockerfile" \
                --arg hard_revision "$hard_revision" \
                --arg hard_version "$hard_version" \
                --arg image "$image" \
                --argjson publish_latest "$publish_latest" \
                --arg version "$version" \
                '{dockerfile: $dockerfile, hard_revision: $hard_revision, hard_version: $hard_version, image: $image, publish_latest: $publish_latest, version: $version}'
            )")
          done

          targets_json=$(printf '%s\n' "${targets[@]}" | jq -cs .)
          echo "targets=$targets_json" >> "$GITHUB_OUTPUT"

  publish:
    needs: discover
    if: needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=latest,enable=${{ matrix.publish_latest }}

      - name: Build and publish ${{ matrix.image }}:${{ matrix.version }}
        uses: docker/build-push-action@v7
        with:
          build-args: |
            HARD_REVISION=${{ matrix.hard_revision }}
            HARD_VERSION=${{ matrix.hard_version }}
          context: .
          file: ${{ matrix.dockerfile }}
          labels: |
            org.opencontainers.image.revision=${{ matrix.hard_revision }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.version }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
