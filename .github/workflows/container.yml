name: Publish container image

on:
  push:
    branches:
      - main
    paths:
      - "target/*.Dockerfile"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find new targets
        id: targets
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "cannot verify newly added targets: missing commit $BEFORE_SHA" >&2
            exit 1
          fi

          mapfile -t dockerfiles < <(
            git diff --diff-filter=A --name-only \
              "$BEFORE_SHA" "$CURRENT_SHA" -- "target/*.Dockerfile"
          )

          targets=()
          for dockerfile in "${dockerfiles[@]}"; do
            filename=${dockerfile#target/}
            target=${filename%.Dockerfile}
            if [[ "$dockerfile" != "target/$target.Dockerfile" ]] || \
               [[ ! "$target" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
              echo "invalid target Dockerfile name: $dockerfile" >&2
              exit 1
            fi

            if [[ "$target" == "linux.v1" ]]; then
              echo "Skipping immutable target $target"
              continue
            fi

            if [[ -n "$(git log -1 --format=%H "$BEFORE_SHA" -- "$dockerfile")" ]]; then
              echo "Skipping previously known target $target"
              continue
            fi

            targets+=("$(
              jq -cn \
                --arg dockerfile "$dockerfile" \
                --arg target "$target" \
                '{dockerfile: $dockerfile, target: $target}'
            )")
          done

          targets_json=$(printf '%s\n' "${targets[@]}" | jq -cs .)
          echo "targets=$targets_json" >> "$GITHUB_OUTPUT"

  publish:
    needs: discover
    if: needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.target }}

      - name: Build and publish ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
