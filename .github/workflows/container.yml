name: Publish container image

on:
  workflow_call:
    inputs:
      hard_revision:
        required: true
        type: string
      hard_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      hard_version:
        description: Existing release tag to retry, for example v5.0
        required: true
        type: string
      target:
        description: Manifest target to retry, for example linux64:glibc.2.35
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release targets
        id: targets
        env:
          CALLED_HARD_REVISION: ${{ inputs.hard_revision }}
          CURRENT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_HARD_VERSION: ${{ inputs.hard_version }}
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          if [[ ! "$INPUT_HARD_VERSION" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "invalid hard version: $INPUT_HARD_VERSION" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$INPUT_HARD_VERSION"; then
            echo "hard release tag does not exist: $INPUT_HARD_VERSION" >&2
            exit 1
          fi

          if [[ -n "$CALLED_HARD_REVISION" ]]; then
            if ! git cat-file -e "$CALLED_HARD_REVISION^{commit}" 2>/dev/null; then
              echo "called hard revision does not exist: $CALLED_HARD_REVISION" >&2
              exit 1
            fi
            hard_revision=$(git rev-parse "$CALLED_HARD_REVISION^{commit}")
            tag_revision=$(git rev-parse "$INPUT_HARD_VERSION^{commit}")
            if [[ "$hard_revision" != "$tag_revision" ]]; then
              echo "called revision does not match $INPUT_HARD_VERSION: $hard_revision" >&2
              exit 1
            fi
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$CURRENT_REF" != refs/heads/main ]]; then
              echo "manual recovery must run from main" >&2
              exit 1
            fi
            hard_revision=$(git rev-parse "$INPUT_HARD_VERSION^{commit}")
          else
            echo "unsupported container publication event: $EVENT_NAME" >&2
            exit 1
          fi

          git checkout --detach "$hard_revision"
          python3 tools/target-manifest-check.py

          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            mapfile -t manifest_targets < <(
              jq -c \
                --arg target "$REQUESTED_TARGET" \
                '.targets[] | select((.image + ":" + .variant) == $target)' \
                target/manifest.json
            )
            if [[ ${#manifest_targets[@]} -ne 1 ]]; then
              echo "manual recovery requires one manifest target: $REQUESTED_TARGET" >&2
              exit 1
            fi
          else
            mapfile -t manifest_targets < <(jq -c '.targets[]' target/manifest.json)
          fi

          latest_hard_version=$(
            git tag --list \
              | awk '/^v[0-9]+\.[0-9]+$/ { print }' \
              | sort -V \
              | tail -1
          )
          targets=()
          for manifest_target in "${manifest_targets[@]}"; do
            dockerfile=$(jq -r '.dockerfile' <<< "$manifest_target")
            image=$(jq -r '.image' <<< "$manifest_target")
            variant=$(jq -r '.variant' <<< "$manifest_target")
            version="$INPUT_HARD_VERSION-$variant"
            publish_latest=false
            if [[ $(jq -r '.publish_latest' <<< "$manifest_target") == true ]] && \
               [[ "$INPUT_HARD_VERSION" == "$latest_hard_version" ]]; then
              publish_latest=true
            fi

            targets+=("$(
              jq -cn \
                --arg dockerfile "$dockerfile" \
                --arg hard_revision "$hard_revision" \
                --arg hard_version "$INPUT_HARD_VERSION" \
                --arg image "$image" \
                --argjson publish_latest "$publish_latest" \
                --arg version "$version" \
                '{dockerfile: $dockerfile, hard_revision: $hard_revision, hard_version: $hard_version, image: $image, publish_latest: $publish_latest, version: $version}'
            )")
          done

          targets_json=$(printf '%s\n' "${targets[@]}" | jq -cs .)
          echo "targets=$targets_json" >> "$GITHUB_OUTPUT"

  publish:
    needs: discover
    if: needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.hard_revision }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Protect immutable version tag
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ matrix.version }}
        run: |
          set -euo pipefail
          error=$(mktemp)
          trap 'rm -f "$error"' EXIT
          if docker manifest inspect "$IMAGE" >/dev/null 2>"$error"; then
            echo "refusing to overwrite published image: $IMAGE" >&2
            exit 1
          fi
          if ! grep -Fqx 'manifest unknown' "$error"; then
            cat "$error" >&2
            exit 1
          fi

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=latest,enable=${{ matrix.publish_latest }}

      - name: Build ${{ matrix.image }}:${{ matrix.version }}
        uses: docker/build-push-action@v7
        with:
          build-args: |
            HARD_REVISION=${{ matrix.hard_revision }}
            HARD_VERSION=${{ matrix.hard_version }}
            IMAGE_VERSION=${{ matrix.version }}
          context: .
          file: ${{ matrix.dockerfile }}
          labels: |
            org.opencontainers.image.revision=${{ matrix.hard_revision }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.version }}
          load: true
          platforms: linux/amd64
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test ${{ matrix.image }}:${{ matrix.version }}
        env:
          HARD_VERSION: ${{ matrix.hard_version }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ matrix.version }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          project=$(mktemp -d)
          hard_root=$(mktemp -d)
          trap 'rm -rf "$project" "$hard_root"' EXIT

          hard_major=${HARD_VERSION#v}
          hard_major=${hard_major%%.*}
          if (( hard_major >= 5 )); then
            embedded_version=$(docker run --rm "$IMAGE" version)
            test "$embedded_version" = "$HARD_VERSION"

            environment_report=$(docker run --rm "$IMAGE" --no-color environment)
            grep -Fqx "  Version             $HARD_VERSION" <<< "$environment_report"

            docker run --rm \
              --entrypoint sh \
              "$IMAGE" \
              -euc 'test ! -e /usr/local/libexec/hard/VERSION'
          fi

          cat > "$project/main.cpp" <<'EOF'
          #include <cstddef>
          #include <iostream>

          int main()
          {
              std::cout << (sizeof(std::max_align_t) > 0 ? "ok" : "invalid");
          }
          EOF

          docker run --rm \
            --mount "type=bind,source=$project,target=/project" \
            --user "$(id -u):$(id -g)" \
            "$IMAGE" \
            build -s main.cpp

          if [[ "$IMAGE_NAME" == windows64 ]]; then
            test -f "$project/main.exe"
            pe=$(docker run --rm \
              --entrypoint /opt/llvm-mingw/bin/llvm-readobj \
              --mount "type=bind,source=$project,target=/project,readonly" \
              --user "$(id -u):$(id -g)" \
              "$IMAGE" \
              --file-headers --coff-imports /project/main.exe)
            grep -F 'IMAGE_FILE_MACHINE_AMD64' <<< "$pe"
            grep -Fi 'api-ms-win-crt-' <<< "$pe"

            output=$(docker run --rm \
              --mount "type=bind,source=$project,target=/project" \
              --mount "type=bind,source=$hard_root,target=/hard" \
              --user "$(id -u):$(id -g)" \
              "$IMAGE" \
              run -s main.cpp)
            test "$output" = ok

            docker run --rm \
              --entrypoint python3 \
              --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
              --mount "type=bind,source=$hard_root,target=/hard" \
              --user "$(id -u):$(id -g)" \
              --workdir /workspace \
              "$IMAGE" \
              unittest/run.py \
              --hard=/usr/local/libexec/hard/hard \
              --executable-suffix=.exe \
              --executable-runner=wine
          else
            output=$(docker run --rm \
              --entrypoint /project/main \
              --mount "type=bind,source=$project,target=/project" \
              --user "$(id -u):$(id -g)" \
              "$IMAGE")
            test "$output" = ok
          fi

          if [[ "$IMAGE_VERSION" == *-static ]]; then
            docker run --rm \
              --entrypoint sh \
              --mount "type=bind,source=$project,target=/project" \
              --user "$(id -u):$(id -g)" \
              "$IMAGE" \
              -euc '! readelf --program-headers /project/main | grep -q INTERP; ! readelf --dynamic /project/main 2>/dev/null | grep -q NEEDED'
          fi

          if [[ "$IMAGE_VERSION" == *-glibc.* ]]; then
            expected=${IMAGE_VERSION##*-glibc.}
            actual=$(docker run --rm \
              --entrypoint getconf \
              "$IMAGE" \
              GNU_LIBC_VERSION)
            test "$actual" = "glibc $expected"
          elif [[ "$IMAGE_VERSION" == *-musl.*-static ]]; then
            expected=${IMAGE_VERSION##*-musl.}
            expected=${expected%-static}
            actual=$(docker run --rm \
              --entrypoint sh \
              "$IMAGE" \
              -c 'ldd --version 2>&1 || true')
            grep -Fqx "Version $expected" <<< "$actual"
          fi

      - name: Publish ${{ matrix.image }}:${{ matrix.version }}
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"
